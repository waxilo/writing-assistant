# Single-container deployment: the web client and API share one container;
# MySQL is the shared `mysql-server` container in ../mysql-server.
#
#   ../mysql-server/scripts/start.sh   # the database must be up first
#   ./scripts/db-init.sh               # one-off: create the dedicated DB + user
#   docker compose up -d --build
#
# Optional public entry: the `tunnel` service below runs cloudflared, which is
# the only way the app reaches the internet (the app itself still publishes on
# 127.0.0.1 only). Needs one-time setup, see cloudflared/config.yml.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: writing-assistant:latest
    container_name: writing-assistant
    restart: unless-stopped
    env_file: .env
    # Only reachable from this machine unless APP_BIND_ADDR says otherwise.
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_PORT:-8787}:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      # The shared MySQL server's network; the database is reached as `mysql`.
      # External so this project never owns (or accidentally removes) it.
      - mysql-server_default

  # Public entry point (Cloudflare Tunnel): writer.sloan.dpdns.org -> app:8787.
  # Reverse direction is impossible — the connector dials out to Cloudflare, so
  # no inbound port is opened and the app keeps its 127.0.0.1-only publishing.
  #
  # Behind a profile so a fresh clone without tunnel setup still runs plain
  # `docker compose up -d`; ./scripts/tunnel-init.sh puts COMPOSE_PROFILES=tunnel
  # into .env, which turns it on for every later compose command.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.9.1
    container_name: writing-assistant-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Host path to the tunnel credentials, set by ./scripts/tunnel-init.sh.
      # `${VAR:?}` fails the compose run instead of starting a half-configured
      # tunnel when the line is missing.
      - "${CF_CRED_FILE:?先执行 ./scripts/tunnel-init.sh 生成隧道凭证}:/etc/cloudflared/credentials.json:ro"
    depends_on:
      app:
        # Otherwise cloudflared starts first and answers 530 until the app is up.
        condition: service_healthy
    networks:
      - mysql-server_default

networks:
  mysql-server_default:
    external: true
