# cloudflared ingress for this project (no secrets here — the credentials file
# is mounted from the host path in $CF_CRED_FILE, see .env).
#
#   cloudflared tunnel create writing-assistant   # once, writes ~/.cloudflared/<uuid>.json
#   cloudflared tunnel route dns writing-assistant writer.sloan.dpdns.org
#
# The tunnel id is not secret; it only identifies which tunnel this connector
# serves. Revoking = deleting the tunnel, which invalidates the credentials.
tunnel: a6aeebb2-d732-4aed-9034-bd993d749a4c
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # One entry is enough: the app serves the web client and the API on the same
  # origin, so the public hostname routes everything to it.
  - hostname: writer.sloan.dpdns.org
    service: http://writing-assistant:8787
  # Catch-all, required as the last rule. cloudflared's built-in page rather
  # than the app: if a stray hostname ever gets pointed at this tunnel it should
  # not start serving the writing assistant.
  - service: hello_world
