name: Backend CI & Deploy

# Gate + deploy the Cloudflare Worker. Every PR runs typecheck + tests; pushes
# to main also apply remote D1 migrations and deploy the Worker when the
# CLOUDFLARE_API_TOKEN secret is configured.
on:
  pull_request:
    branches: [main]
    paths:
      - "back-end/**"
      - ".github/workflows/deploy-api.yml"
  push:
    branches: [main]
    paths:
      - "back-end/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

concurrency:
  group: api-deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        working-directory: back-end
        run: npm ci

      - name: Typecheck (wrangler types + tsc)
        working-directory: back-end
        run: npm run typecheck

      - name: Unit tests
        working-directory: back-end
        run: npm test

      - name: Dry-run deploy
        working-directory: back-end
        run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        working-directory: back-end
        run: npm ci

      - name: Apply remote D1 migrations
        working-directory: back-end
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "33d023f61ebac424923f7285f9b142f8"
        run: |
          echo "y" | npx wrangler d1 migrations apply writer-demo --remote

      - name: Deploy Worker
        working-directory: back-end
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "33d023f61ebac424923f7285f9b142f8"
        run: npx wrangler deploy
